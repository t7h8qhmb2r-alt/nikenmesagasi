<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      background-color: #0e1224;
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
      overflow: hidden;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .map-container {
      background-image: radial-gradient(circle at 2px 2px, #1b1f31 1px, transparent 0);
      background-size: 40px 40px;
    }
    .marker-glow-teal {
      filter: drop-shadow(0 0 8px #4ad7f3);
    }
    .marker-glow-gold {
      filter: drop-shadow(0 0 8px #f0be75);
    }
    .custom-block-shadow {
      box-shadow: 4px 4px 0px 0px rgba(26, 27, 38, 0.5);
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-secondary": "#00363f",
            "outline": "#919096",
            "on-error-container": "#ffdad6",
            "on-tertiary-fixed-variant": "#624000",
            "on-primary-fixed-variant": "#454652",
            "tertiary": "#f0be75",
            "tertiary-container": "#291800",
            "on-background": "#dee1fb",
            "inverse-primary": "#5d5d6a",
            "primary-fixed": "#e2e1f1",
            "on-surface-variant": "#c8c5cc",
            "on-surface": "#dee1fb",
            "surface-container-high": "#25293c",
            "on-tertiary-container": "#a77c3a",
            "secondary-container": "#00b6d0",
            "on-primary-fixed": "#1a1b26",
            "surface-tint": "#c6c5d4",
            "primary-container": "#1a1b26",
            "surface-bright": "#34384c",
            "on-primary-container": "#838391",
            "inverse-on-surface": "#2b2f43",
            "surface": "#0e1224",
            "on-secondary-fixed-variant": "#004e5b",
            "primary-fixed-dim": "#c6c5d4",
            "inverse-surface": "#dee1fb",
            "background": "#0e1224",
            "tertiary-fixed-dim": "#f0be75",
            "surface-container": "#1b1f31",
            "secondary-fixed": "#a6eeff",
            "secondary-fixed-dim": "#4ad7f3",
            "on-tertiary-fixed": "#291800",
            "secondary": "#4ad7f3",
            "on-tertiary": "#442b00",
            "surface-container-highest": "#303447",
            "error-container": "#93000a",
            "surface-dim": "#0e1224",
            "on-secondary-container": "#00424d",
            "surface-variant": "#303447",
            "outline-variant": "#47464c",
            "primary": "#c6c5d4",
            "error": "#ffb4ab",
            "on-secondary-fixed": "#001f25",
            "on-error": "#690005",
            "surface-container-lowest": "#090d1f",
            "surface-container-low": "#161b2d",
            "on-primary": "#2f303b",
            "tertiary-fixed": "#ffddb2"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "fontFamily": {
            "h3": ["Space Grotesk"],
            "label-caps": ["Space Grotesk"],
            "mono-data": ["Space Grotesk"],
            "h1": ["Space Grotesk"],
            "h2": ["Space Grotesk"],
            "body-md": ["Space Grotesk"],
            "body-lg": ["Space Grotesk"]
          },
          "fontSize": {
            "h3": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
            "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700"}],
            "mono-data": ["14px", {"lineHeight": "1.4", "fontWeight": "500"}],
            "h1": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
            "h2": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600"}],
            "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
            "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]
          }
        }
      }
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background">
<!-- TOP APP BAR -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-slate-950 border-b-2 border-slate-700 text-teal-400 font-space-grotesk tracking-tight uppercase">
<div class="flex items-center gap-4">
<button class="active:translate-y-0.5 active:translate-x-0.5 transition-all hover:bg-slate-800 hover:text-teal-300 p-2">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-lg font-bold text-teal-400 tracking-widest">CYBER-LAB TERMINAL</h1>
</div>
<div class="flex items-center gap-4">
<button class="active:translate-y-0.5 active:translate-x-0.5 transition-all hover:bg-slate-800 hover:text-teal-300 p-2">
<span class="material-symbols-outlined">account_circle</span>
</button>
</div>
</header>
<!-- MAP CANVAS (MAIN VIEW) -->
<main class="relative h-screen w-full map-container bg-surface-container-lowest">
<!-- Map Background Image Placeholder -->
<div class="absolute inset-0 opacity-40 grayscale contrast-125">
<img class="w-full h-full object-cover" data-alt="A high-contrast, dark-mode satellite map of a dense urban metropolis at night. The map shows intricate street grids, glowing nodes of light, and dark river pathways, rendered in a futuristic Cyber-Lab Noir aesthetic with deep midnight blues and slate grays. The mood is clinical and high-tech, evoking a high-end research terminal dashboard." data-location="Tokyo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCchzGnT12Q8aKnVNa2GusGNigGwcVcG8S3pwbfFPJBSPQlAYoa-rYcKaTGQhNQcMbeIHyj0Tlzuz0kPGbha7l-liBv0ay84Rvhv2IkOL5ugkETWa9TXqQmdxxeRSQB4SpKH_4eEM-Vj4nI-eXYTMexAvf8pBeRzY-e93LCryxpdzH9A_w67RFc6jJuDrqv32shQ0OcGJMfNa_Zv6a9KZnGf3hCn3uVE9o8P1F1Xzb-h3xuvoKFBu1VVM-xHGHBhso-BH7mCQxNoys"/>
</div>
<!-- MAP MARKERS (SPECIMENS) -->
<!-- Marker 1: Teal (Active) -->
<div class="absolute top-1/3 left-1/4 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="bg-secondary text-on-secondary p-1 border-2 border-slate-950 marker-glow-teal animate-pulse">
<span class="material-symbols-outlined" data-weight="fill">location_on</span>
</div>
<div class="mt-2 bg-slate-950 border border-secondary px-2 py-1">
<span class="font-mono-data text-[10px] text-secondary">SPECIMEN_01</span>
</div>
</div>
<!-- Marker 2: Gold (Special) -->
<div class="absolute top-1/2 left-2/3 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="bg-tertiary text-on-tertiary p-1 border-2 border-slate-950 marker-glow-gold">
<span class="material-symbols-outlined" data-weight="fill">local_bar</span>
</div>
<div class="mt-2 bg-slate-950 border border-tertiary px-2 py-1">
<span class="font-mono-data text-[10px] text-tertiary">SPECIMEN_09</span>
</div>
</div>
<!-- Marker 3: Teal -->
<div class="absolute bottom-1/3 left-1/2 -translate-x-1/2 flex flex-col items-center">
<div class="bg-secondary text-on-secondary p-1 border-2 border-slate-950 marker-glow-teal">
<span class="material-symbols-outlined" data-weight="fill">location_on</span>
</div>
<div class="mt-2 bg-slate-950 border border-secondary px-2 py-1">
<span class="font-mono-data text-[10px] text-secondary">SPECIMEN_04</span>
</div>
</div>
<!-- FLOATING ACTIONS -->
<div class="absolute right-6 top-24 flex flex-col gap-4">
<!-- List View Toggle -->
<button class="bg-surface-container-high border-2 border-outline-variant p-3 custom-block-shadow active:translate-x-1 active:translate-y-1 active:shadow-none transition-all flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">list</span>
</button>
<!-- Locate Button -->
<button class="bg-surface-container-high border-2 border-outline-variant p-3 custom-block-shadow active:translate-x-1 active:translate-y-1 active:shadow-none transition-all flex items-center justify-center text-on-surface">
<span class="material-symbols-outlined">my_location</span>
</button>
</div>
<!-- SELECTED SPECIMEN CARD -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 w-[calc(100%-48px)] max-w-md z-40">
<div class="bg-surface border-2 border-outline-variant p-4 custom-block-shadow flex gap-4">
<!-- Thumbnail -->
<div class="w-24 h-24 bg-surface-container-low border border-outline-variant shrink-0 overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A moody, atmospheric interior of a high-end futuristic cocktail bar. Soft teal neon lighting reflects off metallic surfaces and sleek glassware. The setting is dark and clinical, with a clinical laboratory aesthetic mixed with luxury hospitality. The overall color palette consists of deep blues, silver, and sharp teal accents." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA-8XeXl8dL2XDc0XLCWVhtssPJElfdGvt-HaVuPtVaDxLoY29wdj36_LaZuWCCJVH8aShi845Xihqh9g8rJLBYzE79WA_dy322eQP5AmAgYKARgRtpr-n4P9P7UNJMRctgatOrNtvn-2XltnblYmIlnQVWEx9Fm7xQFWB1-0BSXD5EiST3zT0SXXnhNSJBYvAusUuH8iAdUAkS-_-y7MKqEbpaWzJ6d6BHLNqVeSduHSGXfv6Uq0RNnvkbGkFXW9rQZtL5LNRwkaU"/>
</div>
<!-- Info -->
<div class="flex flex-col justify-between flex-grow">
<div>
<div class="flex justify-between items-start">
<h2 class="font-h3 text-secondary text-base uppercase leading-tight">NEON_OASIS TERMINAL</h2>
<span class="bg-tertiary-container text-tertiary border border-tertiary px-1 text-[10px] font-bold">ACTIVE</span>
</div>
<div class="flex items-center gap-2 mt-1">
<span class="material-symbols-outlined text-outline text-sm">distance</span>
<span class="font-mono-data text-xs text-on-surface-variant">0.8 KM DISTANCE</span>
</div>
</div>
<button class="mt-2 w-full py-2 bg-secondary text-on-secondary font-label-caps text-[10px] tracking-widest border-2 border-slate-950 active:translate-y-0.5 transition-all">
                    VIEW DETAILS
                </button>
</div>
</div>
</div>
</main>
<!-- BOTTOM NAVIGATION BAR -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-4 bg-slate-950 border-t-2 border-slate-700">
<!-- Explore -->
<a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:bg-slate-900 hover:text-teal-200 active:translate-y-0.5 transition-transform" href="#">
<span class="material-symbols-outlined">search</span>
<span class="font-space-grotesk text-[10px] font-bold tracking-tighter uppercase">EXPLORE</span>
</a>
<!-- Maps (Active) -->
<a class="flex flex-col items-center justify-center bg-teal-400 text-slate-950 p-2 scale-95 border-b-2 border-r-2 border-slate-900 active:translate-y-0.5 transition-transform" href="#">
<span class="material-symbols-outlined">map</span>
<span class="font-space-grotesk text-[10px] font-bold tracking-tighter uppercase">MAPS</span>
</a>
<!-- Reservations -->
<a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:bg-slate-900 hover:text-teal-200 active:translate-y-0.5 transition-transform" href="#">
<span class="material-symbols-outlined">event_available</span>
<span class="font-space-grotesk text-[10px] font-bold tracking-tighter uppercase">RESERVATIONS</span>
</a>
<!-- Systems -->
<a class="flex flex-col items-center justify-center text-slate-500 p-2 hover:bg-slate-900 hover:text-teal-200 active:translate-y-0.5 transition-transform" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-space-grotesk text-[10px] font-bold tracking-tighter uppercase">SYSTEMS</span>
</a>
</nav>
</body></html>
